name: Build Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run frontend tests (Vitest)
        run: npm run test

      - name: Build application
        run: npm run build

  # Runner separado a propósito: las Edge Functions corren en Deno, no en
  # Node, y usan imports remotos (https://esm.sh/..., jsr:...) que Vitest no
  # puede resolver — no se intenta unificar con el job de arriba.
  test-edge-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Edge Function tests (Deno)
        # --config explícito: este job corre desde la raíz del repo, y ahí
        # también vive el package.json del frontend — sin apuntar al
        # deno.json de supabase/functions/ (nodeModulesDir: "none"), Deno
        # nunca lo descubre (busca deno.json subiendo desde el cwd, no
        # desde la ruta del argumento) y por default intenta administrar
        # un node_modules/ local que este job nunca instala.
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared
