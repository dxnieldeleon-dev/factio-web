name: Build Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run frontend tests (Vitest)
        run: npm run test

      - name: Build application
        run: npm run build

  # Runner separado a propósito: las Edge Functions corren en Deno, no en
  # Node, y usan imports remotos (https://esm.sh/..., jsr:...) que Vitest no
  # puede resolver — no se intenta unificar con el job de arriba.
  test-edge-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Edge Function tests (Deno)
        run: deno test supabase/functions/_shared
